{% extends 'admin/gate_base.html' %}

{% block gate_content %}
    <span class="gcc-admin-kicker">Check your inbox</span>
    <h1>Request received.</h1>
    <p class="gcc-login-intro">A one-time recovery link is on its way to your verified administrator email.</p>
    <a class="gcc-admin-button gcc-admin-button-outline gcc-login-submit" href="{% url 'admin:access' %}">Return to secure access</a>
    <p class="gcc-login-footnote">The link expires after 30 minutes and does not sign you in automatically.</p>
{% endblock %}
