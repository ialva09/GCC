{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#31518C">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Grand Coast Construction Inc. — thoughtful construction and clear communication across Southern California.">
    <title>{% block title %}Grand Coast Construction Inc.{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'operations/css/site.css' %}?v=20260901-scheduling">
    <link rel="icon" type="image/png" href="{% static 'operations/images/gcc-logo.png' %}">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="{% static 'operations/images/gcc-logo.png' %}">
    {% block extra_head %}{% endblock %}
    <script defer src="{% static 'operations/js/operations.js' %}?v=20260901-scheduling"></script>
    <script defer src="{% static 'operations/js/pwa-register.js' %}"></script>
</head>
<body class="{% block body_class %}{% endblock %}" data-asset-root="{% static 'operations/' %}">
    {% block body %}{% endblock %}

    <div class="toast-region" aria-live="polite" aria-atomic="true">
        {% for message in messages %}
            <div class="toast {% if message.tags %}toast-{{ message.tags }}{% endif %}">{{ message }}</div>
        {% endfor %}
    </div>
    <div class="modal-backdrop" data-modal hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="modal-close" type="button" aria-label="Close dialog" data-action="close-modal">×</button>
            <div data-modal-content></div>
        </section>
    </div>
</body>
</html>
