{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#31518C">
    <meta name="description" content="Grand Coast Construction Inc. — thoughtful construction and clear communication across Southern California.">
    <title>{% block title %}Grand Coast Construction Inc.{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'demo/css/site.css' %}">
    <link rel="icon" type="image/png" href="{% static 'demo/images/gcc-logo.png' %}">
    <script defer src="{% static 'demo/js/demo.js' %}"></script>
</head>
<body class="{% block body_class %}{% endblock %}" data-asset-root="{% static 'demo/' %}">
    {% block body %}{% endblock %}

    <div class="toast-region" aria-live="polite" aria-atomic="true" data-toast-region></div>
    <div class="modal-backdrop" data-modal hidden>
        <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="modal-close" type="button" aria-label="Close dialog" data-action="close-modal">×</button>
            <div data-modal-content></div>
        </section>
    </div>
</body>
</html>
